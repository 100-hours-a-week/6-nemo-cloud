services:

  db:
    container_name: db
    image: mysql:8.0
    ports:
      - "3306:3306"
    env_file:
      - ../../cloud/v2/envs/db.env  
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - nemo-net
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    hostname: redis
    env_file:
      - ../../cloud/v2/envs/db.env  
    volumes:
      - redis-data:/data
    networks:
      - nemo-net
    restart: unless-stopped

  redis-exporter:
    image: bitnami/redis-exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - nemo-net
    depends_on:
      - redis

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888
    networks:
      - nemo-net
    restart: unless-stopped
    volumes:
      - zookeeper-data:/data

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.10.2.2:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - nemo-net
    restart: unless-stopped
    volumes:
      - kafka-data:/kafka

  kafdrop:
    image: obsidiandynamics/kafdrop:3.30.0
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: 10.10.2.2:9092
      JVM_OPTS: -Xms32M -Xmx64M
      SERVER_SERVLET_CONTEXTPATH: /
    networks:
      - nemo-net
    restart: unless-stopped

  backend:
    container_name: backend
    image: asia-northeast3-docker.pkg.dev/nemo-v2/registry/backend:dev-latest
    ports:
      - "8080:8080"
    env_file:
      - ../../cloud/v2/envs/backend.dev.env
    networks:
      - nemo-net
    restart: unless-stopped


  frontend:
    container_name: frontend
    image: asia-northeast3-docker.pkg.dev/nemo-v2/registry/frontend:dev-latest
    ports:
      - "3000:3000"
    env_file:
      - ../../cloud/v2/envs/frontend.dev.env
    networks:
      - nemo-net
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter
    container_name: mysql-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=mysql_exporter:nemo@(db:3306)/
    ports:
      - "9104:9104"
    networks:
      - nemo-net
    depends_on:
      - db
    volumes:
      - ./.my.cnf:/.my.cnf:ro 

networks:
  nemo-net:

volumes:
  mysql-data:
  redis-data:
  zookeeper-data:
  kafka-data:
