{{- range .Values.externalServices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}
  externalIPs:
    - {{ .externalIP }}
{{- end }}
