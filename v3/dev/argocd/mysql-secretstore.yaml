  apiVersion: argoproj.io/v1alpha1
  kind: Application
  metadata:
    name: mysql-secretstore
    namespace: argocd
  spec:
    project: default
    source:
      repoURL: 'https://github.com/100-hours-a-week/6-nemo-cloud.git'
      targetRevision: infra/kubeadm
      path: v3/dev/secretstore/mysql
    destination:
      server: https://kubernetes.default.svc
      namespace: mysql
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true