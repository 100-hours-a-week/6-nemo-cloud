apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://kubernetes.github.io/ingress-nginx'
    targetRevision: 4.7.1
    chart: ingress-nginx
    helm:
      valueFiles:
        - values.yaml
      values: |
        controller:
          service:
            type: NodePort
            nodePorts:
              http: 31320
              https: 30615
          config:
            proxy-body-size: "10m"
            server-snippet: |
              location ~ /\.env { deny all; return 404; }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        defaultBackend:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 