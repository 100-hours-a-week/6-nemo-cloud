apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-secretstore
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/100-hours-a-week/6-nemo-cloud.git'
    targetRevision: infra/kubeadm
    path: v3/dev/secretstore/backend
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: backend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true 