controller:
  replicaCount: 2
  ingressClassResource:
    name: "nginx"
  ingressClass: "nginx"
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  metrics:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi 