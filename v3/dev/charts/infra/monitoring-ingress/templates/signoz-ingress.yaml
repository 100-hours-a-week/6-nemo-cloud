{{- if .Values.signoz.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signoz-ingress
  namespace: {{ .Values.signoz.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- if .Values.tlsSecret }}
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.tlsSecret }}
  tls:
  - hosts:
    - {{ .Values.signoz.host }}
    secretName: {{ .Values.tlsSecret }}
  {{- end }}
  rules:
  - host: {{ .Values.signoz.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.signoz.service }}
            port:
              number: {{ .Values.signoz.port }}
{{- end }} 