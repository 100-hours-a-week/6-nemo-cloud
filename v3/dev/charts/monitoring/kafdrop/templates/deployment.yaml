apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafdrop
  namespace: kafka
  labels:
    app: kafdrop
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: KAFKA_BROKERCONNECT
              value: "{{ .Values.kafka.brokerConnect }}"
            - name: KAFKA_PROPERTIES
              value: |
                {{ .Values.kafka.properties | nindent 16 }}
            - name: KAFKA_SASL_JAAS_CONFIG
              value: "{{ .Values.kafka.saslJaasConfig }}" 