mysql:
  replicas: 1
  image: mysql:8.0
  secretName: mysql-secret
  storage: 5Gi
storageClass:
  name: standard

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "2Gi"

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
