redis:
  replicas: 1
  image: redis:7.2
  secretName: redis-secret
  storage: 1Gi
storageClass:
  name: local-path

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - redis-cli -a $REDIS_PASSWORD ping | grep PONG
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - redis-cli -a $REDIS_PASSWORD ping | grep PONG
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3