redis:
  replicas: 1
  image: redis:7.2
  secretName: redis-secret
  storage: 1Gi
storageClass:
  name: hostpath

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "2Gi"

livenessProbe:
  exec:
    command:
      - sh
      - -c
      - redis-cli -a $REDIS_PASSWORD ping | grep PONG
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - redis-cli -a $REDIS_PASSWORD ping | grep PONG
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3