apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secretstore
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: v3-mysql-secret