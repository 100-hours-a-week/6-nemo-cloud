---
image:
  name: asia-northeast3-docker.pkg.dev/nemo-v2/registry/frontend
  tag: dev3
frontend:
  replicas: 2
  imagePullSecretName: gcp-artifact-registry
  secret: frontend-secret
  containerPort: 3000
  servicePort: 3000
  resources:
    requests:
      memory: "1.5Gi"
      cpu: "0.5"
    limits:
      memory: "2.5Gi"
      cpu: "1"
  livenessProbe:
    httpGet:
      path: /api/healthcheck
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /api/healthcheck
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10