---
image:
  name: asia-northeast3-docker.pkg.dev/nemo-v2/registry/frontend
  tag: dev3 # 추후 유니크 태그로 변경 권장
replicas: 3
imagePullSecretName: gcp-artifact-registry
secret: frontend-secret
containerPort: 3000
servicePort: 3000
resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "200m"
livenessProbe:
  httpGet:
    path: /api/healthcheck
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /api/healthcheck
    port: 3000
  initialDelaySeconds: 10
  periodSeconds: 10