---
image:
  name: asia-northeast3-docker.pkg.dev/nemo-v2/registry/backend
  tag: dev-latest
replicas: 3
imagePullSecretName: gcp-artifact-registry
secret: backend-secret
containerPort: 8080
servicePort: 8080
resources:
  requests:
    memory: "1Gi"
    cpu: "200m"
  limits:
    memory: "2Gi"
    cpu: "500m"
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
