apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: kafka
    targetRevision: 25.0.0
    helm:
      values: |
        # KRaft 비활성화 (ZooKeeper 기반 운영)
        kraft:
          enabled: false

        controller:
          replicaCount: 0

        # ZooKeeper 설정
        zookeeper:
          enabled: true
          replicaCount: 3
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 30s

        # Kafka 브로커 설정
        broker:
          replicaCount: 3
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard

        # 인증 및 암호화 완전 비활성화 (PLAINTEXT only)
        auth:
          enabled: false
          clientProtocol: PLAINTEXT
          interBrokerProtocol: PLAINTEXT
          sasl:
            enabled: false
            mechanisms: []
        
        tls:
          type: disabled
        
        # PLAINTEXT 강제 설정
        extraConfig: |
          listener.security.protocol.map=CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT
          security.inter.broker.protocol=PLAINTEXT
          sasl.enabled.mechanisms=
          sasl.mechanism.inter.broker.protocol=PLAIN
          sasl.mechanism.client.protocols=PLAIN

        extraEnvVars:
          - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
            value: "CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT"
          - name: KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL
            value: "PLAINTEXT"
          - name: KAFKA_CFG_SASL_ENABLED_MECHANISMS
            value: ""

        # 메트릭 설정
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 10s
            jobLabel: kafka
            selector:
              matchLabels:
                app.kubernetes.io/name: kafka
                app.kubernetes.io/instance: kafka

        # 공통 설정
        global:
          storageClass: standard

        service:
          type: ClusterIP

        logPersistence:
          enabled: false

        securityContext:
          enabled: false

        resources:
          limits:
            memory: 1Gi
            cpu: 1000m
          requests:
            memory: 512Mi
            cpu: 500m
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
