apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: kafka
    targetRevision: 25.0.0
    helm:
      values: |
        # KRaft 비활성화 (ZooKeeper 기반 운영)
        kraft:
          enabled: false
        
        controller:
          replicaCount: 0
        
        # ZooKeeper 설정
        zookeeper:
          enabled: true
          replicaCount: 3
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 30s
        
        # Kafka 브로커 설정 (기존 도커 컴포즈 방식)
        broker:
          replicaCount: 3
          persistence:
            enabled: true
            size: 8Gi
            storageClass: standard
        
        # 인증 완전 비활성화 (PLAINTEXT only)
        auth:
          enabled: false
        
        tls:
          type: disabled
        
        # PLAINTEXT 설정으로 강제 변경
        extraConfig: |
          listeners=PLAINTEXT://0.0.0.0:9092
          advertised.listeners=PLAINTEXT://kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local:9092,PLAINTEXT://kafka-broker-1.kafka-broker-headless.kafka.svc.cluster.local:9092,PLAINTEXT://kafka-broker-2.kafka-broker-headless.kafka.svc.cluster.local:9092
          listener.security.protocol.map=PLAINTEXT:PLAINTEXT
          security.inter.broker.protocol=PLAINTEXT
          sasl.enabled.mechanisms=
          sasl.mechanism.inter.broker.protocol=PLAIN
          auto.create.topics.enable=true
          delete.topic.enable=true
          offsets.topic.replication.factor=1
          transaction.state.log.replication.factor=1
          transaction.state.log.min.isr=1
        
        # 환경변수로 PLAINTEXT 강제 설정
        extraEnvVars:
          - name: KAFKA_CFG_LISTENERS
            value: "PLAINTEXT://0.0.0.0:9092"
          - name: KAFKA_CFG_ADVERTISED_LISTENERS
            value: "PLAINTEXT://kafka-broker-0.kafka-broker-headless.kafka.svc.cluster.local:9092,PLAINTEXT://kafka-broker-1.kafka-broker-headless.kafka.svc.cluster.local:9092,PLAINTEXT://kafka-broker-2.kafka-broker-headless.kafka.svc.cluster.local:9092"
          - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
            value: "PLAINTEXT:PLAINTEXT"
          - name: KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL
            value: "PLAINTEXT"
          - name: KAFKA_CFG_SASL_ENABLED_MECHANISMS
            value: ""
          - name: KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL
            value: "PLAIN"
          - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
            value: "true"
          - name: KAFKA_CFG_DELETE_TOPIC_ENABLE
            value: "true"
          - name: KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR
            value: "1"
          - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
            value: "1"
          - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
            value: "1"
        
        # 메트릭 설정
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            interval: 30s
            scrapeTimeout: 10s
            jobLabel: kafka
            selector:
              matchLabels:
                app.kubernetes.io/name: kafka
                app.kubernetes.io/instance: kafka
        
        # 공통 설정
        global:
          storageClass: standard
        
        service:
          type: ClusterIP
        
        logPersistence:
          enabled: false
        
        securityContext:
          enabled: false
        
        resources:
          limits:
            memory: 1Gi
            cpu: 1000m
          requests:
            memory: 512Mi
            cpu: 500m
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
