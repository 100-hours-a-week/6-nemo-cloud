apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: kafka
    targetRevision: 25.0.0
    helm:
      values: |
        replicaCount: 3
        global:
          storageClass: local-path
        controller:
          persistence:
            enabled: true
            size: 8Gi
            storageClass: local-path
        zookeeper:
          replicaCount: 3
          persistence:
            enabled: true
            size: 8Gi
            storageClass: local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 