apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.12.3
    helm:
      parameters:
        - name: "argocd.serverAddress"
          value: "argocd-server.argocd.svc"
        - name: "config.registries[0].name"
          value: "gcp"
        - name: "config.registries[0].prefix"
          value: "asia-northeast3-docker.pkg.dev"
        - name: "config.registries[0].api_url"
          value: "https://asia-northeast3-docker.pkg.dev"
        - name: "config.registries[0].credentials"
          value: "pullsecret:app/gar-helm-repo"
        - name: "config.registries[0].default"
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
data:
  kube.events: "false"
  log.level: info
  registries.conf: |
    registries:
      - api_url: https://asia-northeast3-docker.pkg.dev
        credentials: pullsecret:app/gar-helm-repo
        default: true
        name: gcp
        prefix: asia-northeast3-docker.pkg.dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-updater-secret-reader
  namespace: app
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-updater-secret-reader-binding
  namespace: app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-updater-secret-reader
subjects:
- kind: ServiceAccount
  name: argocd-image-updater
  namespace: argocd 