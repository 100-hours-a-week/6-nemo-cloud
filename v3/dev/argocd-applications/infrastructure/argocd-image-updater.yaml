apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 0.12.2 
    helm:
      valueFiles:
        - argocd-applications/infrastructure/argocd-image-updater-values.yaml
      parameters:
        - name: "argocd.serverAddress"
          value: "argocd-server.argocd.svc"
        - name: "image.pullSecrets[0].name"
          value: "gcp-artifact-registry"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 