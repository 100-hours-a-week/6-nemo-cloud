apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: kafka
    targetRevision: 25.0.0
    helm:
      values: |
        replicaCount: 3
        # SASL 인증을 비활성화하고 PLAINTEXT를 사용합니다.
        auth:
          enabled: false
        global:
          storageClass: local-path
        # Broker(StatefulSet)의 데이터 저장 설정
        persistence:
          enabled: true
          size: 8Gi
          storageClass: local-path
        # Zookeeper 설정
        zookeeper:
          replicaCount: 3
          persistence:
            enabled: true
            size: 8Gi
            storageClass: local-path
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 