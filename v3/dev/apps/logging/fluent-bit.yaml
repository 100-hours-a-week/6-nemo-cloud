apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/6-nemo-cloud.git
    targetRevision: infra/kubeadm
    path: v3/dev
    helm:
      repoURL: https://fluent.github.io/helm-charts
      chart: fluent-bit
      targetRevision: 0.46.8
      valueFiles:
        - charts/logging/fluent-bit.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 