apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/6-nemo-cloud.git
    targetRevision: infra/kubeadm
    path: v3/dev
    helm:
      repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.6.2
      valueFiles:
        - v3/dev/charts/logging/loki.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 