apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 5.41.4       # 원하는 버전
    helm:
      values: |
        isDefault: true
        persistence:
          enabled: true
          size: 10Gi
        tableManager:
          retention_deletes_enabled: true
          retention_period: 168h
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
