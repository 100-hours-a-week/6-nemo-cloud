apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/6-nemo-cloud.git
    targetRevision: infra/kubeadm
    path: v3/dev
    helm:
      repoURL: https://prometheus-community.github.io/helm-charts
      chart: alertmanager
      targetRevision: 1.8.0
      valueFiles:
        - charts/monitoring/alertmanager.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 