apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 7.3.9
    helm:
      values: |
        # 스토리지만 hostpath로 설정, 나머지는 공식 기본값 사용
        persistence:
          storageClassName: hostpath 