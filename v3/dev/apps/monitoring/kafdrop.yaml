apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafdrop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/obsidiandynamics/kafdrop.git'
    targetRevision: 4.1.0 # 최신 릴리즈 버전 사용
    path: 'chart'
    helm:
      values: |
        kafka:
          brokerConnect: "kafka.kafka.svc.cluster.local:9092"
        image:
          tag: "4.1.0"
        # Ingress를 사용하려면 아래 주석을 해제하고 설정하세요.
        # ingress:
        #   enabled: true
        #   hosts:
        #     - host: kafdrop.your-domain.com
        #       paths:
        #         - path: /
        #           pathType: ImplementationSpecific
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'monitoring'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true 