apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/6-nemo-cloud.git
    targetRevision: infra/kubeadm
    path: v3/dev
    helm:
      repoURL: https://charts.signoz.io
      chart: signoz
      targetRevision: 0.36.1
      valueFiles:
        - v3/dev/charts/observability/signoz.values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 