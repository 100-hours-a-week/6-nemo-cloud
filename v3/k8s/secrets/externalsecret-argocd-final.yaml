apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-image-updater-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-image-updater-secret
    creationPolicy: Owner
  data:
    # GitHub 토큰만 External Secret에서 관리 (Git 커밋용)
    - secretKey: github.token
      remoteRef:
        key: backend-env-prod
        property: GITHUB_TOKEN
    # AWS 인증은 IRSA를 통해 처리하므로 AWS 자격증명은 제외
