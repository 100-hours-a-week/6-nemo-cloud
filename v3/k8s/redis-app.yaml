apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/6-nemo-cloud.git
    targetRevision: infra/application
    path:  v3/helm-charts/redis
    helm:
      valueFiles:
        - values-redis.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: redis  # 그대로 redis 네임스페이스
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true