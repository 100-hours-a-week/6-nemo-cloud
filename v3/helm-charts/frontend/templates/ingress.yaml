{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          # API paths (backend)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-proxy
                port:
                  number: 8080
          # Health check path for ALB (redirect to frontend)
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: {{ $.Values.service.port }}
          # Backend healthcheck path
          - path: /api/healthcheck
            pathType: Exact
            backend:
              service:
                name: backend-proxy
                port:
                  number: 8080
          # Auth paths (backend)
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: backend-proxy
                port:
                  number: 8080
          # Swagger UI paths (backend)
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend-proxy
                port:
                  number: 8080
          # Swagger resources paths (backend)  
          - path: /swagger-resources
            pathType: Prefix
            backend:
              service:
                name: backend-proxy
                port:
                  number: 8080
          # V3 API docs paths (backend)
          - path: /v3
            pathType: Prefix
            backend:
              service:
                name: backend-proxy
                port:
                  number: 8080
          # Static images (frontend)
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: {{ $.Values.service.port }}
          # Frontend paths (catch-all, must be last)
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}