apiVersion: v1
kind: Service
metadata:
  name: backend-proxy
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
---
apiVersion: v1
kind: Endpoints
metadata:
  name: backend-proxy
  namespace: {{ .Release.Namespace }}
subsets:
- addresses:
  - ip: "172.20.206.239"  # backend service ClusterIP
  ports:
  - port: 8080
    protocol: TCP
    name: http