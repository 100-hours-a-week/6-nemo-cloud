apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_KAKAO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: NEXT_PUBLIC_KAKAO_REDIRECT_URI
            - name: NEXT_PUBLIC_GA_ID
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: NEXT_PUBLIC_GA_ID
            - name: WEBHOOK_CLOUD_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: WEBHOOK_CLOUD_URL
            - name: WEBHOOK_FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: WEBHOOK_FRONTEND_URL
            - name: HEALTHCHECK_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: HEALTHCHECK_URL
            - name: REGISTRY_URL
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: REGISTRY_URL