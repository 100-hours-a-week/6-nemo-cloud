apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-sentinel
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "[Init] Waiting for redis DNS..."
              until nslookup redis-0.redis-headless.redis.svc.cluster.local > /dev/null 2>&1; do
                echo "DNS not yet available. Retrying..."
                sleep 2
              done
              echo "[Init] Redis DNS resolved!"
      containers:
        - name: sentinel
          image: redis:7.2
          ports:
            - containerPort: 26379
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
          command: ["redis-server", "/etc/redis/sentinel.conf", "--sentinel"]
          lifecycle:
            preStart:
              exec:
                command:
                  - sh
                  - -c
                  - |
                    echo "[PreStart] Waiting for redis to be reachable..."
                    until nc -z redis-0.redis-headless.redis.svc.cluster.local 6379; do
                      echo "Redis not yet reachable. Retrying..."
                      sleep 2
                    done
                    echo "[PreStart] Redis is up!"
          startupProbe:  # ✨ 새로 추가
            exec:
              command:
                - sh
                - -c
                - 'nslookup redis-0.redis-headless.redis.svc.cluster.local'
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: sentinel-config
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - redis-sentinel
              topologyKey: topology.kubernetes.io/zone
