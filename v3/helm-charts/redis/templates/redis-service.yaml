# ❌ Redis Internal LoadBalancer 불필요 - ClusterIP로 충분
# 비용 절약을 위해 제거됨 (Internal NLB 비용 $18/월 절약)
#
# Redis 접근은 headless service 또는 클러스터 내부 접근만 필요
# 외부에서 Redis 직접 접근은 보안상 권장하지 않음
#
# 필요 시 다시 활성화 가능:
# {{- if .Values.externalAccess.enabled }}
# apiVersion: v1
# kind: Service
# metadata:
#   name: redis-internal
#   namespace: {{ .Release.Namespace }}
#   annotations:
#     service.beta.kubernetes.io/aws-load-balancer-internal: "true"
#     service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
#     service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
# spec:
#   ports:
#     - port: 6379
#       targetPort: 6379
#       protocol: TCP
#       name: redis
#   selector:
#     app: redis
#   type: LoadBalancer
# {{- end }}