serviceAccount:
  create: false
  name: kafka-sa

kafka:
  externalAdvertisedHost: a1fea77a8ae4b44148ca9853dbf320e3-5176641.ap-northeast-2.elb.amazonaws.com
  replicaCount: 3

  statefulset:
    name: kafka

  container:
    port: 9092
    controllerPort: 9093
    externalPort: 9094  # 외부에서 접근할 포트
  
  image:
    repository: bitnami/kafka
    tag: 3.6.0

  service:
    name: kafka-headless
    type: ClusterIP
    port: 9092
    targetPort: 9092

  volumePermissions:
    enabled: true
    securityContext:
      runAsUser: 0
      runAsGroup: 0

  persistence:
    enabled: true
    storageClass: gp3  # # 이미 존재하는 gp3 StorageClass를 참조만 함
    size: 10Gi

  storageClass:
    create: false  #Kafka Helm Chart에서 StorageClass 생성 시도하지 않도록 차단

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kafka
            topologyKey: topology.kubernetes.io/zone

  zookeeper:
    enabled: true
    replicaCount: 3
    persistence:
      enabled: true
      storageClass: gp3
      size: 10Gi

    
  kraft:
    enabled: false

  #kraft:
  #  enabled: true
  #  clusterId: 2N0jE9q6QDWYxidBhVkb5w  # 클러스터 고정 UUID
  #  quorumVoters: |
  #    0@kafka-controller-0.kafka-headless.kafka.svc.cluster.local:9093,\
  #    1@kafka-controller-1.kafka-headless.kafka.svc.cluster.local:9093,\
  #    2@kafka-controller-2.kafka-headless.kafka.svc.cluster.local:9093



  externalAccess:
    enabled: false  # 기존 multi-LoadBalancer 비활성화
    service:
      type: LoadBalancer
      ports:
        external: 9094
    autoDiscovery:
      enabled: true

  singleExternalAccess:
    enabled: true   # 단일 LoadBalancer 활성화

  nodePortAccess:
    enabled: true

