apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-start-script
  namespace: {{ .Release.Namespace }}
data:
  start.sh: |
    #!/bin/bash
    set -e

    HOSTNAME=$(hostname)
    NODE_ID=$(echo "${HOSTNAME}" | grep -o '[0-9]*')
    export KAFKA_CFG_NODE_ID=$NODE_ID
    
    # 내부 통신: 클러스터 내부에서는 headless 서비스 사용
    # 외부 통신: NodePort를 통한 접근
    case $NODE_ID in
      0)
        EXTERNAL_ENDPOINT="{{ .Values.kafka.externalAdvertisedHost }}:30094"
        ;;
      1)
        EXTERNAL_ENDPOINT="{{ .Values.kafka.externalAdvertisedHost }}:30095"
        ;;
      2)
        EXTERNAL_ENDPOINT="{{ .Values.kafka.externalAdvertisedHost }}:30096"
        ;;
      *)
        EXTERNAL_ENDPOINT="{{ .Values.kafka.externalAdvertisedHost }}:9094"
        ;;
    esac
    
    echo "Node $NODE_ID starting with external endpoint: $EXTERNAL_ENDPOINT"
    
    # 내부 통신용 PLAINTEXT와 외부 통신용 EXTERNAL 리스너 설정
    export KAFKA_CFG_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.{{ .Values.kafka.service.name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.kafka.container.port }},EXTERNAL://${EXTERNAL_ENDPOINT}"
    
    exec /opt/bitnami/scripts/kafka/entrypoint.sh /opt/bitnami/scripts/kafka/run.sh