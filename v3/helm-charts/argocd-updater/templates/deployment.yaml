apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-image-updater
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-image-updater
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-image-updater
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      imagePullSecrets:
        - name: ghcr-secret  # GitHub Container Registry Pull Secret
      containers:
        - name: argocd-image-updater
          image: docker.io/argoprojlabs/argocd-image-updater:v0.11.3
          args:
            {{- range .Values.controller.extraArgs }}
            - {{ . }}
            {{- end }}
          volumeMounts:
            - name: registry-config
              mountPath: /app/config/registries.conf
              subPath: registries.conf
            # ssh 볼륨 mount 필요하면 추가 가능
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: github.token
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: argocd-image-updater-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: argocd-image-updater-secret
                  key: AWS_SECRET_ACCESS_KEY
      volumes:
        - name: registry-config
          configMap:
            name: argocd-image-updater-registry
