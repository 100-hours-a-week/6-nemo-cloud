controller:
  extraArgs:
    - run
    - --registries-conf-path=/app/config/registries.conf

  extraVolumes:
    - name: registry-config
      configMap:
        name: argocd-image-updater-registry

  extraVolumeMounts:
    - name: registry-config
      mountPath: /app/config/registries.conf
      subPath: registries.conf

git:
  writeBranch: infra/image-updater
  user:
    name: halfmoon01
    email: onurivit01@gmail.com
  commitMessageTemplate: "Chore: update image to {{ .NewImage }}"
  pgpSign: false

webhook:
  enabled: true
  method: POST
  url: https://discord.com/api/webhooks/1392729701843341313/ppziPHdh0eWfrh29DhEX8f8iOFOKfMvzt9UFnERIYo-lCLeLiNyvg5-xONBZWifFZAaG
  headers:
    Content-Type: application/json
  payload: |
    {
      "content": "🚀 ArgoCD Image Updater\n✅ Application: `{{ .appName }}`\n📦 Image: `{{ .image }}`\n🆕 Tag: `{{ .newTag }}`"
    }

secret:
  create: false
  name: argocd-image-updater-secret

serviceAccount:
  create: true
  name: argocd-image-updater
  annotations:
    eks.amazonaws.com/role-arn: $arn:aws:iam::084375578827:role/argocd-image-updater-irsa

image:
  pullSecrets:
    - name: ghcr-secret  # GitHub Container Registry Pull Secret