apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.backend.namespace.name }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: {{ .Values.backend.serviceAccount.name }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
            # deployment.yaml에서 Secret을 참조하는 방법
            - secretRef:
                name: backend-secret