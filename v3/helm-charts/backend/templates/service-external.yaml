apiVersion: v1
kind: Service
metadata:
  name: backend-external
  namespace: {{ .Values.backend.namespace.name }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
