backend:
  serviceAccount:
    name: backend     ## Deployment에서 사용할 ServiceAccount 이름
  namespace:
    name: frontend    ## 배포될 Namespace 이름 (backend → frontend로 변경)
  image:
    repository: 084375578827.dkr.ecr.ap-northeast-2.amazonaws.com/backend
    tag: prod-20250714-1752
  replicas: 3
  imagePullSecrets:
    - name: regcred   # ✅ ECR용 이미지 Pull 시크릿
  
  # 환경변수 설정
  env:
    # AI 서버 연결 설정 (퍼블릭 IP 사용 - 모든 곳에서 접근 가능)
    AI_SERVER_URL: "http://3.39.105.108:8000"
    AI_SERVER_HOST: "3.39.105.108"
    AI_SERVER_PORT: "8000"
    
    # Kafka 연결 설정  
    KAFKA_BOOTSTRAP_SERVERS: "kafka-headless.kafka.svc.cluster.local:9092"
    KAFKA_BROKER_URL: "kafka-headless.kafka.svc.cluster.local:9092"
    
    # 기타 설정
    ENVIRONMENT: "production"
    LOG_LEVEL: "INFO"
 